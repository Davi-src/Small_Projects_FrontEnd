<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Davi-src">
  <!--======= Style =======-->
  <link rel="stylesheet" href="./src/css/style.css">
  <!--======= Title =======-->
  <title>Contador</title>
</head>

<body>
  
  <main class="container">
    <!--======= Title =======-->
    <header class="title">
      <h1>
        Contador
      </h1>
    </header>

    <!--======= Result counter =======-->
    <div class="result">
      <p id="counter">
        0
      </p>
    </div>

    <!--======= Actions =======-->
    <div class="actions">
      <div class="field">
        <input class="input" type="number" id="value" placeholder="Valor variavel" value="1">
        <label for="value" class="label">Valor variavel</label>
      </div>

      <!--======= Control =======-->
      <div class="buttons">
        <button class="btn" id="btn-sub">( - ) Subtrair</button>
        <button class="btn" id="btn-clear">( 0 ) Zerar</button>
        <button class="btn" id="btn-sum">( + ) Somar</button>
      </div>
    </div>
    
  </main>

  <script src="src/js/script.js"></script>

</body>

</html>

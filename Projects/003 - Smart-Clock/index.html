<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Davi-src">
  <!-- Font Google -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!--======= Style =======-->
  <link rel="stylesheet" href="src/css/style.css">
  <!--======= Title =======-->
  <title>Relógio digital inteligente</title>
</head>

<body>

  <main class="clock-container">

    <div class="clock-card">
      <header class="header">
        <h1>
          Relógio digital inteligente
        </h1>
      </header>

      <section class="clock">
        <div id="time" class="time">00 : 00 : 00</div>
        <div id="ampm" class="ampm hidden"></div>
        <div id="date" class="date">---</div>
      </section>

      <section class="controls">
        <button id="toggle-format" class="btn primary"></button>
        <button id="toggle-theme" class="btn secondary"></button>
      </section>
    </div>

    <footer>
      <p>By me <a href="https://github.com/Davi-src">&copy;Davi-src</a>.</p>
    </footer>
  </main>

  <script src="src/js/script.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Davi-src">
  <!-- Font Google -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!--======= Style =======-->
  <link rel="stylesheet" href="src/css/style.css">
  <!--======= Title =======-->
  <title>Cronometro</title>
</head>

<body>

  <main class="container">
    <!--======= Status =======-->
    <header class="status">
      <span id="status-indicator"></span>
      <span id="status-text">Parado</span>
    </header>

    <!--======= Display =======-->
    <section id="timer-card" class="timer-card">
      <div class="timer" id="timer">
        00 : 00 . 00
      </div>

      <!--======= Controls =======-->
      <div class="controls">
        <button id="toggle-btn" class="btn start">▶️ Iniciar</button>
        <button id="reset-btn" class="btn reset">🔄️ Reiniciar</button>
        <button id="lap-btn" class="btn lap" disabled>🏁 Volta</button>
      </div>
    </section>

    <!--======= Shortcuts === Atalhos =======-->
    <section class="shortcuts">
      <h3>Atalhos de Teclado</h3>
      <ul>
        <li><kbd>Espaço</kbd> Iniciar / Pausar</li>
        <li><kbd>R</kbd> Reiniciar</li>
        <li><kbd>L</kbd> Registrar Volta</li>
      </ul>
    </section>

    <!--======= laps =======-->
    <section id="laps-container" class="laps hidden">
      <h3>Voltas Registradas</h3>
      <div id="laps-list"></div>
    </section>

  </main>

  <footer>
    <p>By me <a href="https://github.com/Davi-src">&copy;Davi-src</a>.</p>
  </footer>

  <script src="src/js/script.js"></script>
</body>

</html>
